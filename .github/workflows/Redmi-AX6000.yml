name: Build_Redmi_AX6000

# Add a button to trigger the workflow
on: 
  schedule:
    - cron: '0 4 * * *'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      SSH_ACTION:
        description: 'SSH connection to Actions'
        required: false
        default: false
        type: boolean
          
env:
  #设置immortalwrt源码地址，以及克隆
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - name: 清理运行环境 (Clean environment)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E swapoff -a || true
          sudo -E rm -f /swapfile /mnt/swapfile || true
          sudo -E snap set system refresh.retain=2 2>/dev/null || true
          sudo -E rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo find /etc/apt/sources.list.d/ -type f ! -name "ubuntu.sources" -delete 2>/dev/null || true
          sudo -E apt-get -y purge azure-cli ghc* zulu* firefox google-chrome-stable dotnet* powershell openjdk* mysql* mongodb* moby* docker* containerd* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get -y clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile} 2>/dev/null || true
          rm -rf ~/{.cargo,.dotnet,.rustup,.npm,.cache} 2>/dev/null || true
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 合并磁盘 Disks
        uses: easimon/maximize-build-space@v10
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: 将github存储库签出到运行器
        uses: actions/checkout@v7

      - name: 安装编译依赖 (Install dependencies)
        run: |
          chmod +x ./install-deps-ubuntu-2404.sh
          ./install-deps-ubuntu-2404.sh
        
      - name: 下载源码  
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          #echo "src-git ssrp https://github.com/fw876/helloworld.git" >> ./feeds.conf.default

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          git clone https://github.com/adminchenyu/LAN-Wake.git feeds/packages/LAN-Wake
          ./scripts/feeds install -a

      - name: Configuration Customization - Build_Redmi_AX6000
        env:
          CONFIG_FILE: 'redmi_ac2100.config'
        run: |
          [ -e $CONFIG_FILE ] && mv -f $CONFIG_FILE openwrt/.config
          chmod +x ./customize.sh && ./customize.sh
          cd openwrt && make defconfig
          ls
          
      - name: SSH connection to Actions
        if: ${{ inputs.SSH_ACTION == true }}
        uses: mxschmitt/action-tmate@v3

      - name: 自定义设置类
        run: |
          #删除所有 feed 提供的旧版 openclash（如 immortalwrt luci feed 版本），防止与克隆的官方 dev 版冲突
          rm -rf openwrt/package/feeds/*/luci-app-openclash

          chmod +x $GITHUB_WORKSPACE/patches/*.sh
          cd openwrt/package/feeds/luci
          #执行自定义插件
          $GITHUB_WORKSPACE/patches/Plugins-ax6000.sh



      - name: Download package
        working-directory: ./openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread build."
          make -j $(($(nproc)+1)) || make -j$(nproc) V=s || make -j1 V=s
          
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          #获取固件架构
          DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
          echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
          DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

      - name: 固件上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt
          path: openwrt/bin/targets
          

        #软件包分类
      - name: Package Firmware 
        run: |
          #在openwrt目录下创建目录为upload目录名
          cd ./openwrt && mkdir ./upload

          rm -rf $(find ./bin/targets/ -iregex ".*\(json\|buildinfo\|sha256sums\|packages\)$")
          cp -rf $(find ./bin/targets/ -type f -iname "*.*") ./upload/
          cp -rf ./.config ./upload/Config_"Redmi-ax6000"_"imm源码"_"$FILE_DATE".txt
          cd ./bin/targets/*/*
          echo "KERNEL=$(cat *.manifest | grep ^kernel | head -n 1 | cut -d- -f2 | tr -d ' ')" >> $GITHUB_ENV
          cd "$GITHUB_WORKSPACE/openwrt/upload"

      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d_%H.%M.%S-redmiax6000")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "### 📒 固件信息" >> release.txt
          echo "Redmi-ax6000 自用精简" >> release.txt
          echo "- 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}" >> release.txt
          echo "- 💝 系统版本: ${{ env.REPO_BRANCH }}" >> release.txt
          echo "- 🚀 内核版本: ${{ env.KERNEL }}" >> release.txt
          echo "- 🌐 默认地址: 192.168.31.1" >> release.txt
          echo "- 👤 账号：root" >> release.txt
          echo "- 🔑 默认密码: 空 或者 password" >> release.txt
          echo "编译的源码取自：https://github.com/immortalwrt/immortalwrt" >> release.txt
          echo "集成插件：1、openclash[集成Meta内核] 2、TTYD 终端 3、网络唤醒 4、frp客户端 5、frp服务端
          6、alist 7、UPNP" >> release.txt
          echo "默认主题：Argon" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT
          
          #上传固件以发布
      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ./openwrt/upload/*.*

    
      - name: 上传日志
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-build-logs
          path: |
            openwrt/build_dir/**/*.log
            openwrt/logs/*
            openwrt/tmp/*.log
#            retention-days: 3  # 可选，设置日志保留天数


      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1  #保留工作流程运行的天数。默认30
          keep_minimum_runs: 3 #每个工作流程（或如果启用了，每天）至少要保留的运行次数。use_daily_retention 默认6

          
      - name: Remove old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          releases_keep_latest: 3
          delete_releases: true
          delete_tags: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
