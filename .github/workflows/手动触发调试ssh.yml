name: 手动触发调试 tmate

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: '启用 tmate SSH 调试会话'
        required: false
        default: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 启动 tmate 调试会话
        if: ${{ inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
