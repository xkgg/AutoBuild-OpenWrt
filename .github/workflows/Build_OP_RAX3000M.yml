

name: Build_RAX3000M

# Add a button to trigger the workflow
on: 
  schedule:
    - cron: '0 4 * * *'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      SSH_ACTION:
        description: 'SSH远程配置固件'
        required: false
        default: false
        type: boolean
           
      ddnsto_set:
        description: 'ddnsto信息自动配置'
        required: false
        default: false
        type: boolean
           
env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v24.10.8
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
    - name: Show system
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'   

    - name: 清理运行环境 (Clean environment)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E swapoff -a || true
        sudo -E rm -f /swapfile /mnt/swapfile || true
        sudo -E snap set system refresh.retain=2 2>/dev/null || true
        sudo -E rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
        sudo find /etc/apt/sources.list.d/ -type f ! -name "ubuntu.sources" -delete 2>/dev/null || true
        sudo -E apt-get -y purge azure-cli ghc* zulu* firefox google-chrome-stable dotnet* powershell openjdk* mysql* mongodb* moby* docker* containerd* || true
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile} 2>/dev/null || true
        rm -rf ~/{.cargo,.dotnet,.rustup,.npm,.cache} 2>/dev/null || true
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 合并磁盘 Disks
      uses: easimon/maximize-build-space@v10
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: 将github存储库签出到运行器
      uses: actions/checkout@v7

    - name: 安装编译依赖 (Install dependencies)
      run: |
        chmod +x ./install-deps-ubuntu-2404.sh
        ./install-deps-ubuntu-2404.sh
        
    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        #echo "src-git ssrp https://github.com/fw876/helloworld.git" >> ./feeds.conf.default
        echo 'src-git nas https://github.com/linkease/nas-packages.git;master' >> feeds.conf.default
        echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' >> feeds.conf.default
        echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages' >> feeds.conf.default
        echo 'src-git small https://github.com/kenzok8/small' >> feeds.conf.default

        
    - name: Update & Install feeds
      working-directory: ./openwrt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/feeds update -a && rm -rf feeds/luci/applications/luci-app-mosdns
        rm -rf feeds/packages/net/{adguardhome,mosdns,xray*,v2ray*,v2ray*,sing*,smartdns}
        rm -rf feeds/packages/kenzo/ddnsto
        rm -rf feeds/packages/utils/v2dat
        rm -rf feeds/packages/lang/golang
        # 网络唤醒插件
        git clone https://github.com/adminchenyu/LAN-Wake.git feeds/packages/LAN-Wake 
        git clone https://github.com/kenzok8/golang -b 1.26 feeds/packages/lang/golang

        # 更新 frps / frpc 到最新版，并同步升级 net/frp/files 及 luci-app-frpc / luci-app-frps (TOML 新版)
        FRP_MAKEFILE="feeds/packages/net/frp/Makefile"
        if [ -f "$FRP_MAKEFILE" ]; then
          AUTH_HEADER=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi
          FRP_TAG=$(curl -fsSL "${AUTH_HEADER[@]}" "https://api.github.com/repos/fatedier/frp/releases/latest" 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)
          if [ -z "$FRP_TAG" ]; then
            FRP_TAG=$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/fatedier/frp/releases/latest" 2>/dev/null | grep '/tag/' | awk -F'/tag/' '{print $NF}' || true)
          fi
          FRP_VER="${FRP_TAG#v}"
          if [[ "$FRP_VER" =~ ^[0-9]+(\.[0-9]+)+([.-][0-9A-Za-z]+)*$ ]]; then
            mkdir -p dl
            FRP_TAR="dl/frp-${FRP_VER}.tar.gz"
            if curl -fsSL --retry 3 --retry-delay 5 "https://codeload.github.com/fatedier/frp/tar.gz/v${FRP_VER}" -o "$FRP_TAR" && tar -tzf "$FRP_TAR" >/dev/null 2>&1; then
              FRP_HASH=$(sha256sum "$FRP_TAR" | awk '{print $1}')
              FRP_VER="$FRP_VER" FRP_HASH="$FRP_HASH" FRP_MAKEFILE="$FRP_MAKEFILE" python3 - <<'EOF'
        import os, re
        path = os.environ["FRP_MAKEFILE"]
        ver = os.environ["FRP_VER"]
        sha = os.environ["FRP_HASH"]
        with open(path, "r", encoding="utf-8") as f:
            text = f.read()
        text = re.sub(r"^PKG_VERSION:=.*$", f"PKG_VERSION:={ver}", text, flags=re.M)
        text = re.sub(r"^PKG_RELEASE:=.*$", "PKG_RELEASE:=1", text, flags=re.M)
        text = re.sub(r"^PKG_HASH:=.*$", f"PKG_HASH:={sha}", text, flags=re.M)
        if "GO_PKG_TAGS:=" not in text:
            text = re.sub(
                r"^(GO_PKG_BUILD_PKG:=.*)$",
                r"\1\nGO_PKG_TAGS:=noweb\nGO_PKG_LDFLAGS:=-s -w\nGO_PKG_LDFLAGS_X:=github.com/fatedier/frp/pkg/util/version.version=$(PKG_VERSION)",
                text,
                flags=re.M,
            )
        old_conf = "\t$(INSTALL_DATA) $(PKG_BUILD_DIR)/conf/$(2)_full.ini $(1)/etc/frp/$(2).d/"
        new_conf = (
            "\tif [ -f \"$(PKG_BUILD_DIR)/conf/$(2)_full_example.toml\" ]; then \\\n"
            "\t\t$(INSTALL_DATA) $(PKG_BUILD_DIR)/conf/$(2)_full_example.toml $(1)/etc/frp/$(2).d/; \\\n"
            "\telif [ -f \"$(PKG_BUILD_DIR)/conf/$(2)_full.ini\" ]; then \\\n"
            "\t\t$(INSTALL_DATA) $(PKG_BUILD_DIR)/conf/$(2)_full.ini $(1)/etc/frp/$(2).d/; \\\n"
            "\tfi"
        )
        text = text.replace(old_conf, new_conf)
        text = re.sub(
            r"(define Package/\$\(1\)/conffiles\n/etc/config/\$\(1\)\n)(  endef)",
            r"\1/etc/frp/$(1).d/\n\2",
            text,
        )
        with open(path, "w", encoding="utf-8") as f:
            f.write(text)
        EOF
              echo "::notice ::frps/frpc 已更新至最新版 v${FRP_VER} (sha256: ${FRP_HASH})"
            else
              echo "::warning ::下载 frp v${FRP_VER} 源码包失败，保留默认版本"
              rm -f "$FRP_TAR"
            fi
          else
            echo "::warning ::获取 frp 最新版本号失败，保留默认版本"
          fi
        fi

        # 同步 openwrt/packages (master) 的 net/frp/files 及 openwrt/luci (master) 的 luci-app-frpc / luci-app-frps
        rm -rf /tmp/frp-master-pkg /tmp/frp-master-luci
        if git clone --depth=1 --filter=blob:none --sparse -b master https://github.com/openwrt/packages.git /tmp/frp-master-pkg \
          && git -C /tmp/frp-master-pkg sparse-checkout set net/frp/files \
          && [ -f /tmp/frp-master-pkg/net/frp/files/frpc.init ] \
          && [ -f /tmp/frp-master-pkg/net/frp/files/frps.init ]; then
          rm -rf feeds/packages/net/frp/files
          cp -a /tmp/frp-master-pkg/net/frp/files feeds/packages/net/frp/files
          echo "::notice ::已同步 openwrt/packages (master) net/frp/files (TOML init/config)"
        else
          echo "::error ::拉取 openwrt/packages (master) net/frp/files 失败"
          exit 1
        fi

        if git clone --depth=1 --filter=blob:none --sparse -b master https://github.com/openwrt/luci.git /tmp/frp-master-luci \
          && git -C /tmp/frp-master-luci sparse-checkout set applications/luci-app-frpc applications/luci-app-frps \
          && [ -f /tmp/frp-master-luci/applications/luci-app-frpc/htdocs/luci-static/resources/view/frpc.js ] \
          && [ -f /tmp/frp-master-luci/applications/luci-app-frps/htdocs/luci-static/resources/view/frps.js ]; then
          rm -rf feeds/luci/applications/luci-app-frpc feeds/luci/applications/luci-app-frps
          cp -a /tmp/frp-master-luci/applications/luci-app-frpc feeds/luci/applications/luci-app-frpc
          cp -a /tmp/frp-master-luci/applications/luci-app-frps feeds/luci/applications/luci-app-frps
          echo "::notice ::已同步 openwrt/luci (master) luci-app-frpc / luci-app-frps"
        else
          echo "::error ::拉取 openwrt/luci (master) luci-app-frpc / luci-app-frps 失败"
          exit 1
        fi
        rm -rf /tmp/frp-master-pkg /tmp/frp-master-luci

        ./scripts/feeds install -a
      
        
    #- name: Import external feeds - passwall
    #  working-directory: ./openwrt
    #  run: |
    #    git clone https://github.com/xiaorouji/openwrt-passwall.git package/lienol
    #    git clone "your_github_link" package/"your_folder_name"      

    #- name: Import external feeds - JerryKuKu Argon
    #  working-directory: ./openwrt
    #  run: |
    #    git clone -b 18.06 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon-jerrykuku

    - name: Configuration Customization - Build_RAX3000M
      env:
        CONFIG_FILE: 'rax3000openwrt.config'
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x ./rax3000m/customize.sh && ./rax3000m/customize.sh
        cd openwrt && make defconfig
        
    - name: SSH远程连接（make menuconfig）
      if: ${{ inputs.SSH_ACTION == true }}
      uses: mxschmitt/action-tmate@v3
      
    - name: 自定义设置类
      run: |
        #删除所有 feed 提供的旧版 openclash（含 small feed 版本），防止与克隆的官方 dev 版冲突
        rm -rf openwrt/package/feeds/*/luci-app-openclash

        chmod +x $GITHUB_WORKSPACE/patches/*.sh
        chmod +x $GITHUB_WORKSPACE/rax3000m/*.sh
        cd openwrt/package/feeds/luci
        #执行自定义插件
        $GITHUB_WORKSPACE/patches/Plugins.sh
        
    - name: ddnsto配置
      if: ${{ inputs.ddnsto_set == true }}
      run: |
        rm -f $GITHUB_WORKSPACE/openwrt/package/feeds/nas/ddnsto/files/ddnsto.config
        cd $GITHUB_WORKSPACE/openwrt/package/feeds/nas/ddnsto/files
        cp "$GITHUB_WORKSPACE/rax3000m/ddnsto.config" "$GITHUB_WORKSPACE/openwrt/package/feeds/nas/ddnsto/files"
        #cp "$GITHUB_WORKSPACE/patches/wmk.config" "$GITHUB_WORKSPACE/openwrt/package/feeds/packages/frp/files/"
        #mv wmk.config frpc.config
        chmod 0755 ./ddnsto.config

    - name: Download package
      working-directory: ./openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Build firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread build."
        make -j $(($(nproc)+1)) || make -j$(nproc) V=s || make -j1 V=s
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV
        #获取固件架构
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV

    - name : Upload artifact 固件上传
      uses: actions/upload-artifact@v7
      with:
        name: OpenWrt_固件
        path: openwrt/bin/targets

        #软件包分类
    - name: Package Firmware 
      run: |
          #在openwrt目录下创建目录为upload目录名
          cd ./openwrt && mkdir ./upload
          rm -rf $(find ./bin/targets/ -iregex ".*\(json\|buildinfo\|sha256sums\|packages\)$")
          cp -rf $(find ./bin/targets/ -type f -iname "*.*") ./upload/
          cp -rf ./.config ./upload/Config_"Rax3000"_"openwrt源码"_"$FILE_DATE".txt
          cd ./bin/targets/*/*
          echo "KERNEL=$(cat *.manifest | grep ^kernel | head -n 1 | cut -d- -f2 | tr -d ' ')" >> $GITHUB_ENV
          rm -rf *.manifest
          cd "$GITHUB_WORKSPACE/openwrt/upload"

    - name: Generate release tag
      id: tag
      run: |
          echo "release_tag=$(date +"%Y.%m.%d_%H.%M.%S-Rax3000m")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "### 📒 固件信息" >> release.txt
          echo "Rax3000M 自用精简 openwrt：" >> release.txt
          echo "- 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}" >> release.txt
          echo "- 💝 系统版本: ${{ env.REPO_BRANCH }}" >> release.txt
          echo "- 🚀 内核版本: ${{ env.KERNEL }}" >> release.txt
          echo "- 🌐 默认地址: 192.168.10.1" >> release.txt
          echo "- 👤 账号：root" >> release.txt
          echo "- 🔑 默认密码: 空 或者 password" >> release.txt
          
          echo "编译的源码取自：https://github.com/openwrt/openwrt" >> release.txt
          echo "集成插件：1、openclash[集成Meta内核] 2、TTYD 终端 3、网络唤醒 4、frp客户端 5、frp服务端
          6、alist 7、UPNP" >> release.txt
          echo "默认主题：Argon" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT
          
          #上传固件以发布
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ./openwrt/upload/*.*

    - name: 上传日志
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: openwrt-build-logs
        path: |
          openwrt/build_dir/**/*.log
          openwrt/logs/*
          openwrt/tmp/*.log

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 3
 
    - name: Remove old Releases
      uses: ophub/delete-releases-workflows@main
      with:
          releases_keep_latest: 3
          delete_releases: true
          delete_tags: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
